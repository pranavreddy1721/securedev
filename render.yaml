services:
  - type: web
    name: securedev-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: 12
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: GITHUB_TOKEN_ENC_KEY
        sync: false
      - key: MAX_UPLOAD_MB
        value: 25
      - key: SEMGREP_RULESETS
        value: p/javascript,p/nodejs,p/expressjs
      - key: SEMGREP_TIMEOUT_MS
        value: 120000
      - key: NPM_AUDIT_TIMEOUT_MS
        value: 60000
